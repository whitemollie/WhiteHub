name: Bug report
description: Something does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WhiteHub version
      description: Shown on the About page.
      placeholder: 0.2.4
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Vendor and exact model name
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: "Settings → Export report. Read it before attaching: it contains device names, settings and the log."
